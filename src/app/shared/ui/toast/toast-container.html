<div class="pointer-events-none fixed inset-x-0 bottom-0 z-[100] flex flex-col items-center gap-3 px-4 pb-5 sm:items-end sm:px-6">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item pointer-events-auto relative flex w-full max-w-sm items-start gap-3.5 overflow-hidden rounded-xl bg-white py-3.5 pl-5 pr-4 shadow-[0_8px_30px_-8px_rgba(11,31,69,0.35)] ring-1 ring-black/5"
      role="status"
    >
      <span
        class="absolute inset-y-0 left-0 w-1"
        [class.bg-[#2e8b3d]]="toast.type === 'success'"
        [class.bg-red-500]="toast.type === 'error'"
        [class.bg-[#1170b8]]="toast.type === 'info'"
      ></span>

      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full shadow-sm"
        [class.bg-[#2e8b3d]]="toast.type === 'success'"
        [class.bg-red-500]="toast.type === 'error'"
        [class.bg-[#1170b8]]="toast.type === 'info'"
      >
        @if (toast.type === 'success') {
          <i class="pi pi-check text-[13px] text-white"></i>
        } @else if (toast.type === 'error') {
          <i class="pi pi-times text-[13px] text-white"></i>
        } @else {
          <i class="pi pi-info-circle text-[13px] text-white"></i>
        }
      </span>

      <div class="min-w-0 flex-1 pt-0.5">
        <p class="text-[13.5px] font-semibold leading-tight text-[#0b1f45]">
          {{ toast.message }}
        </p>
        @if (toast.description) {
          <p class="mt-1 text-[12.5px] leading-snug text-neutral-500">{{ toast.description }}</p>
        }
      </div>

      <button
        type="button"
        (click)="dismiss(toast.id)"
        class="shrink-0 text-neutral-300 transition-colors hover:text-neutral-500"
        aria-label="Cerrar notificación"
      >
        <i class="pi pi-times text-[11px]"></i>
      </button>
    </div>
  }
</div>
