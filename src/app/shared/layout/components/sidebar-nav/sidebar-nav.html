<p class="px-3.5 mb-3 text-[11px] font-semibold tracking-[0.08em] text-white/35 uppercase">Menú</p>
<ul class="space-y-1">
  @for (item of items(); track item.path) {
    <li>
      <a
        [routerLink]="item.path"
        routerLinkActive="active-nav-item bg-white/[0.07] text-white"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        (click)="linkClicked.emit()"
        class="group relative flex items-center gap-3 rounded-xl pl-3 pr-3.5 py-2.5 text-[15px] font-medium leading-snug text-white/60 transition-colors hover:bg-white/4 hover:text-white/90"
      >
        <span
          class="absolute left-0 top-1/2 h-5 w-0.75 -translate-y-1/2 rounded-full bg-[#17abe2] opacity-0 transition-opacity duration-150 in-[.active-nav-item]:opacity-100"
        ></span>
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/5 text-white/55 transition-colors group-hover:text-white/80 in-[.active-nav-item]:bg-[#17abe2]/15 in-[.active-nav-item]:text-[#17abe2]"
        >
          <i class="pi text-[17px]" [class]="item.icon"></i>
        </span>
        {{ item.label }}
      </a>
    </li>
  }
</ul>
