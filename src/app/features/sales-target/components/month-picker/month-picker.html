<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="flex items-center gap-1.5 text-sm font-medium text-neutral-800 focus:outline-none cursor-pointer"
  >
    {{ months()[selected() - 1] }}
    <i class="pi pi-chevron-down text-[10px] text-[#1170b8] transition-transform" [class.rotate-180]="open()"></i>
  </button>

  @if (open()) {
    <div class="absolute left-0 top-full mt-2 w-40 rounded-xl border border-neutral-200 bg-white shadow-lg py-1.5 z-50 max-h-72 overflow-y-auto">
      @for (m of months(); track m; let i = $index) {
        <button
          type="button"
          (click)="select(i)"
          class="flex w-full items-center justify-between px-3.5 py-2 text-sm text-left transition-colors"
          [class.bg-[#0b1f45]]="selected() === i + 1"
          [class.text-white]="selected() === i + 1"
          [class.font-semibold]="selected() === i + 1"
          [class.text-neutral-700]="selected() !== i + 1"
          [class.hover:bg-[#eef3fc]]="selected() !== i + 1"
        >
          {{ m }}
        </button>
      }
    </div>
  }
</div>
